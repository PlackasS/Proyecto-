name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Buscar y descomprimir proyecto
        run: |
          mkdir proyecto
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          echo "ZIP encontrado: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d proyecto

      - name: Preparar compatibilidad Java 17
        run: |
          BUILD_FILE=$(find proyecto -name "build.gradle.kts" -path "*/app/*" | head -n 1)
          echo "Build encontrado: $BUILD_FILE"
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$BUILD_FILE"
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$BUILD_FILE"

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(find proyecto -name "settings.gradle.kts" -print -quit | xargs dirname)
          echo "Proyecto: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Emprendimiento-debug-apk
          path: |
            proyecto/**/app/build/outputs/apk/debug/app-debug.apk
