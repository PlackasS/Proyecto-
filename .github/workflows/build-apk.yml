name: Compilar APK - Administración Emprendimiento

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Buscar ZIP del proyecto
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP en la raíz del repositorio."
            echo "Sube AdministracionEmprendimiento_GitHub.zip al repositorio."
            exit 1
          fi
          echo "ZIP encontrado: $ZIP_FILE"
          mkdir -p proyecto
          unzip -q "$ZIP_FILE" -d proyecto

      - name: Encontrar proyecto Android
        shell: bash
        run: |
          set -e
          SETTINGS=$(find proyecto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts."
            find proyecto -maxdepth 4 -type f | sort
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Proyecto Android encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar estructura del proyecto
        shell: bash
        run: |
          set -e
          echo "Contenido del proyecto:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: No se encontró el módulo app."
            exit 1
          fi

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: La compilación terminó pero no se encontró el APK."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi
          echo "APK generado correctamente:"
          ls -lh "$APK"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AdministracionEmprendimiento-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
